<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan Barcode Inventaris</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --bg:#0b0f14; --card:#161c23; --text:#e8ecf0; --muted:#97a3b0; --line:#323b45; --brand:#6ea8fe; --ok:#5bc27a; --err:#f28b82; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:560px; margin:0 auto; padding:14px; }
  h1 { font-size:18px; margin:4px 0 10px; }
  #reader { width:100%; min-height:260px; background:#000; border-radius:12px; overflow:hidden; }
  #msg { font-size:14px; margin-top:10px; min-height:20px; word-break:break-word; color:var(--muted); }
  #msg.err { color:var(--err); } #msg.ok { color:var(--ok); }
  .row { display:flex; gap:8px; margin-top:12px; }
  .row > * { flex:1; }
  select { padding:12px; font-size:15px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); min-width:0; }
  input[type=text] { padding:12px; font-size:16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); min-width:0; }
  button { padding:12px 14px; font-size:15px; border:0; border-radius:8px; background:var(--brand); color:#05203f; cursor:pointer; }
  button.sec { background:transparent; color:var(--brand); border:1px solid var(--brand); }
  button:disabled { opacity:.45; }
  .hidden { display:none !important; }
  .tools { align-items:center; }
  .tools input[type=range] { flex:2; }
  .small { font-size:12px; color:var(--muted); margin-top:10px; }
  a { color:var(--brand); }
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 Arahkan kamera ke barcode</h1>
  <div id="reader"></div>
  <div id="msg">Memulai kamera…</div>

  <div class="row tools">
    <button id="btnTorch" class="sec hidden" type="button">🔦 Senter</button>
    <input id="zoom" type="range" class="hidden" aria-label="Zoom">
  </div>
  <div class="row">
    <select id="camSel" class="hidden" aria-label="Pilih kamera"></select>
  </div>

  <div class="row">
    <input id="manual" type="text" placeholder="atau ketik kode manual" autocomplete="off">
    <button id="btnGo" type="button" style="flex:0 0 auto">OK</button>
  </div>

  <div class="row">
    <button id="btnPhoto" class="sec" type="button">📸 Foto barcode (cadangan)</button>
    <button id="btnBack" class="sec" type="button">← Kembali</button>
  </div>
  <input id="photo" type="file" accept="image/*" capture="environment" class="hidden">
  <div id="fileReader" class="hidden"></div>

  <div class="small">Tips: dekatkan sampai barcode memenuhi lebar kotak, tahan stabil, hindari pantulan cahaya. Nyalakan senter bila gelap.</div>
  <div id="noApp" class="small hidden"></div>
</div>

<script>
  // ================= KONFIGURASI =================
  // Biasanya TIDAK perlu diisi: aplikasi mengirim alamatnya sendiri lewat ?app=...
  // Isi hanya bila ingin alamat tetap, mis. 'https://script.google.com/macros/s/AKfy.../exec'
  const DEFAULT_APP_URL = '';
  // Kode harus terbaca sama sebanyak ini berturut-turut sebelum diterima (mengurangi salah baca)
  const CONFIRM_READS = 2;

  const $ = id => document.getElementById(id);
  const CODE_RE = /^[A-Za-z0-9._-]{1,40}$/;
  const APP_RE = /^https:\/\/script\.google\.com\/(a\/macros\/[^\/]+\/|macros\/)s\/[A-Za-z0-9_-]+\/(exec|dev)$/;

  function setMsg(t, cls) { $('msg').textContent = t || ''; $('msg').className = cls || ''; }
  function beep() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; g.gain.value = 0.1;
      o.connect(g); g.connect(ctx.destination); o.start();
      setTimeout(() => { o.stop(); ctx.close(); }, 120);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(60);
  }

  // ---- alamat aplikasi (hanya domain script.google.com yang diterima) ----
  let APP_URL = '';
  (function () {
    const p = new URLSearchParams(location.search).get('app') || '';
    const cands = [p, DEFAULT_APP_URL];
    try { cands.push(localStorage.getItem('invent-app-url') || ''); } catch (e) {}
    for (const c of cands) { if (APP_RE.test(c)) { APP_URL = c; break; } }
    if (APP_URL) { try { localStorage.setItem('invent-app-url', APP_URL); } catch (e) {} }
    else {
      $('noApp').classList.remove('hidden');
      $('noApp').textContent = 'Alamat aplikasi belum diketahui. Buka scanner ini lewat tombol Scan di aplikasi, atau isi DEFAULT_APP_URL di scanner.html.';
    }
  })();

  function goBack(code) {
    if (!APP_URL) {
      setMsg(code ? 'Terbaca: ' + code + '. Alamat aplikasi belum diketahui, salin kode ini dan tempel di aplikasi.' : 'Alamat aplikasi belum diketahui.', code ? 'ok' : 'err');
      return;
    }
    location.replace(APP_URL + (code ? '?code=' + encodeURIComponent(code) : ''));
  }

  // ================= PEMINDAI =================
  let sc = null, facing = 'environment', done = false, lastVal = '', streak = 0;

  async function accept(raw) {
    const code = String(raw || '').trim();
    if (done || !code) return;
    if (!CODE_RE.test(code)) { setMsg('Terbaca "' + code.slice(0, 30) + '" tetapi bukan kode inventaris. Coba lagi.', 'err'); lastVal = ''; streak = 0; return; }
    if (code === lastVal) streak++; else { lastVal = code; streak = 1; }
    if (streak < CONFIRM_READS) return;
    done = true;
    beep();
    setMsg('Terbaca: ' + code + '. Kembali ke aplikasi…', 'ok');
    try { if (sc) await sc.stop(); } catch (e) {}
    goBack(code);
  }

  function track() {
    const v = document.querySelector('#reader video');
    const s = v && v.srcObject;
    return s && s.getVideoTracks ? s.getVideoTracks()[0] : null;
  }
  function setupTools() {
    const t = track(); if (!t || !t.getCapabilities) return;
    let caps = {}; try { caps = t.getCapabilities() || {}; } catch (e) {}
    if ('torch' in caps) {
      $('btnTorch').classList.remove('hidden');
      let on = false;
      $('btnTorch').onclick = async () => {
        try { on = !on; await t.applyConstraints({ advanced: [{ torch: on }] }); $('btnTorch').textContent = on ? '🔦 Senter: nyala' : '🔦 Senter'; }
        catch (e) { on = !on; setMsg('Senter tidak didukung perangkat ini.', 'err'); }
      };
    }
    if (caps.zoom && caps.zoom.max > caps.zoom.min) {
      const z = $('zoom');
      z.min = caps.zoom.min; z.max = caps.zoom.max; z.step = caps.zoom.step || 0.1;
      z.value = caps.zoom.min;   // jangan zoom otomatis (bisa membuat gambar hitam di sebagian HP)
      z.classList.remove('hidden');
      z.oninput = () => t.applyConstraints({ advanced: [{ zoom: Number(z.value) }] }).catch(() => {});
    }
  }

  // ---------- kamera: daftar, pilih, mulai ----------
  let cams = [], token = 0, attempts = 0;
  const RE_REAR = /back|rear|environment|belakang|world/i;
  const RE_FRONT = /front|user|depan|selfie/i;
  const camScore = c => { const l = c.label || ''; let n = 0;
    if (RE_REAR.test(l)) n += 10; if (RE_FRONT.test(l)) n -= 10; if (/ultra|tele|macro|depth/i.test(l)) n -= 3; return n; };

  async function stopCam() {
    try { if (sc) { if (sc.isScanning) await sc.stop(); sc.clear(); } } catch (e) {}
    sc = null;
    $('btnTorch').classList.add('hidden'); $('zoom').classList.add('hidden');
  }
  function showError(err) {
    const n = String((err && (err.name || err.message)) || err);
    if (/NotAllowed|Permission/i.test(n)) setMsg('Izin kamera ditolak. Ketuk ikon gembok di kiri alamat URL → Izin/Kamera → Izinkan, lalu muat ulang. Atau ketik kode manual.', 'err');
    else if (/NotFound|Devices/i.test(n)) setMsg('Kamera tidak ditemukan di perangkat ini. Ketik kode manual atau pakai foto barcode.', 'err');
    else if (/NotReadable|TrackStart|in use/i.test(n)) setMsg('Kamera sedang dipakai aplikasi/tab lain. Tutup lalu coba lagi.', 'err');
    else setMsg('Kamera tidak bisa dibuka: ' + n, 'err');
  }
  async function rawStart(id, withVC) {
    const F = Html5QrcodeSupportedFormats;
    sc = new Html5Qrcode('reader', {
      formatsToSupport: [F.CODE_128, F.CODE_39, F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.ITF, F.CODABAR, F.QR_CODE],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });
    const cfg = { fps: 12, qrbox: (w, h) => ({ width: Math.floor(Math.min(w * 0.92, 420)), height: Math.floor(Math.min(h * 0.5, 180)) }) };
    if (id && withVC) cfg.videoConstraints = { deviceId: { exact: id }, width: { ideal: 1280 }, height: { ideal: 720 } };
    await sc.start(id || { facingMode: 'environment' }, cfg, accept, () => {});
  }
  async function startCam(id) {
    const my = ++token;
    await stopCam();
    done = false; lastVal = ''; streak = 0;
    setMsg('Memulai kamera…');
    try {
      try { await rawStart(id, true); }
      catch (e1) { if (!/NotAllowed|Permission/i.test(String(e1 && (e1.name || e1)))) { await stopCam(); await rawStart(id, false); } else throw e1; }
    } catch (err) { if (my === token) showError(err); return; }
    if (my !== token) return;
    if (id) { try { localStorage.setItem('invent-cam', id); } catch (e) {} $('camSel').value = id; }
    setMsg('Tahan barcode sejajar di dalam kotak.');
    setupTools();
    // pengaman: bila 3 detik tidak ada gambar, coba kamera berikutnya
    setTimeout(() => {
      if (my !== token || done) return;
      const v = document.querySelector('#reader video');
      if (v && v.videoWidth > 0 && v.readyState >= 2) return;
      if (cams.length > 1 && attempts < cams.length - 1) {
        attempts++;
        const i = cams.findIndex(c => c.id === id);
        const next = cams[(i + 1) % cams.length];
        setMsg('Gambar tidak muncul, mencoba kamera lain…', 'err');
        startCam(next.id);
      } else setMsg('Gambar kamera tidak muncul. Pilih kamera lain dari daftar di bawah, atau pakai foto barcode.', 'err');
    }, 3000);
  }
  async function start() {
    if (!window.Html5Qrcode) { setMsg('Library pemindai gagal dimuat (cek koneksi internet), muat ulang halaman. Atau ketik kode manual.', 'err'); return; }
    if (!window.isSecureContext) { setMsg('Halaman harus dibuka lewat HTTPS agar kamera bisa dipakai.', 'err'); return; }
    setMsg('Meminta izin kamera…');
    try { cams = (await Html5Qrcode.getCameras() || []).slice().sort((a, b) => camScore(b) - camScore(a)); }
    catch (err) { showError(err); return; }
    if (cams.length) {
      $('camSel').innerHTML = cams.map((c, i) => '<option value="' + c.id + '">' + (c.label || ('Kamera ' + (i + 1))).replace(/</g, '') +
        (RE_REAR.test(c.label || '') ? ' (belakang)' : RE_FRONT.test(c.label || '') ? ' (depan)' : '') + '</option>').join('');
      $('camSel').classList.remove('hidden');
    }
    let saved = ''; try { saved = localStorage.getItem('invent-cam') || ''; } catch (e) {}
    attempts = 0;
    const pick = cams.find(c => c.id === saved) || cams[0];
    startCam(pick ? pick.id : null);
  }
  $('camSel').onchange = () => { attempts = 99; startCam($('camSel').value); };

  // manual
  const submitManual = () => {
    const c = $('manual').value.trim();
    if (!CODE_RE.test(c)) { setMsg('Kode tidak valid (huruf/angka, titik, strip, garis bawah).', 'err'); return; }
    done = true; goBack(c);
  };
  $('btnGo').onclick = submitManual;
  $('manual').onkeydown = e => { if (e.key === 'Enter') submitManual(); };

  // cadangan: foto barcode
  $('btnPhoto').onclick = () => $('photo').click();
  $('photo').onchange = async e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    setMsg('Membaca barcode dari foto…');
    try {
      let text = '';
      if ('BarcodeDetector' in window) {
        try {
          const det = new BarcodeDetector({ formats: ['code_128', 'code_39', 'ean_13', 'ean_8', 'upc_a', 'upc_e', 'itf', 'codabar', 'qr_code'] });
          const r = await det.detect(await createImageBitmap(f));
          if (r.length) text = r[0].rawValue;
        } catch (er) {}
      }
      if (!text) {
        try { if (sc) { await sc.stop(); } } catch (er) {}
        const fr = new Html5Qrcode('fileReader', { verbose: false });
        text = await fr.scanFile(f, false);
      }
      streak = CONFIRM_READS - 1; lastVal = String(text).trim();
      accept(text);
    } catch (er) {
      setMsg('Barcode tidak terbaca dari foto. Dekatkan kamera, pastikan tajam dan tidak silau, lalu foto ulang.', 'err');
    }
  };

  $('btnBack').onclick = () => { try { if (sc) sc.stop(); } catch (e) {} goBack(''); };
  window.addEventListener('pagehide', () => { try { if (sc) sc.stop(); } catch (e) {} });
  window.addEventListener('load', start);
</script>
</body>
</html>
